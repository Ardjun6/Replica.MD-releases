<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 76" width="360" height="76" role="img" aria-labelledby="title">
  <title id="title">ReplicaMD logo</title>
  <style>
    .ink { fill: #18181b; }
    .paper { fill: #ffffff; }
    .outline { fill: #ffffff; stroke: #18181b; stroke-width: 2.5; }
    .name { font: 600 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -1px; }
    .letters { font: 750 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -1.5px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f4f4f5; }
      .paper { fill: #18181b; }
      .outline { fill: #18181b; stroke: #f4f4f5; }
    }
  </style>
  <rect class="outline" x="7" y="7" width="52" height="52" rx="14"/>
  <rect class="ink" x="17" y="17" width="52" height="52" rx="14"/>
  <text class="paper letters" x="43" y="44" text-anchor="middle" dominant-baseline="middle">RMD</text>
  <text class="ink name" x="88" y="48">ReplicaMD</text>
</svg>
